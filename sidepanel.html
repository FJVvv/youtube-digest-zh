<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Digest</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "YouTube Digest" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <div class="header-actions">
          <button
            class="settings-btn"
            id="settingsBtn"
            type="button"
            title="打开 YouTube Digest 设置"
            aria-label="打开 YouTube Digest 设置"
          >
            设置
          </button>
          <div
            class="transcript-mode-control global-language-control"
            id="transcriptModeControl"
            role="group"
            aria-label="内容语言"
            style="display: none"
          >
            <button
              class="transcript-mode-btn active"
              type="button"
              data-transcript-mode="original"
              aria-pressed="true"
            >原文</button>
            <button
              class="transcript-mode-btn"
              type="button"
              data-transcript-mode="zh"
              aria-pressed="false"
            >中文</button>
            <button
              class="transcript-mode-btn"
              type="button"
              data-transcript-mode="bilingual"
              aria-pressed="false"
            >双语</button>
            <span
              class="translation-spinner"
              id="langSpinner"
              aria-label="正在翻译"
            ></span>
          </div>
        </div>
      </div>

      <!-- Tab navigation -->
      <div class="tabs" id="tabsNav" style="display: none">
        <button class="tab active" data-tab="transcript">字幕</button>
        <button class="tab" data-tab="overview">概览</button>
        <button class="tab" data-tab="notes">笔记</button>
        <button class="tab" data-tab="chat">对话</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon" aria-hidden="true"></div>
        <div class="welcome-title">准备生成摘要</div>
        <div class="welcome-desc">
          打开任意 YouTube 视频，点击扩展图标即可获取 AI 摘要。
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText">正在获取字幕</div>
          <div class="loading-subtext" id="loadingSubtext">
            正在从视频中提取字幕…
          </div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container">
          <div class="error-icon" aria-hidden="true">!</div>
          <div class="error-title" id="errorTitle">出错了</div>
          <div class="error-message" id="errorMessage">
            出现错误，请稍后重试。
          </div>
          <button class="error-btn" id="errorBtn">重试</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div class="tab-panel active" data-panel="transcript">
          <div class="section">
            <div class="section-header transcript-section-header">
              <div class="section-title">完整字幕</div>
              <div class="transcript-actions">
                <button class="enhance-btn" id="copyTranscriptBtn">复制</button>
                <button class="enhance-btn" id="exportTranscriptBtn">
                  导出
                </button>
              </div>
            </div>
            <p class="transcript-source-note" id="transcriptSourceNote" hidden></p>
            <!-- Search stays inside the Transcript tab and never changes playback. -->
            <div class="transcript-search" role="search">
              <svg
                class="transcript-search-icon"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <circle cx="8.5" cy="8.5" r="5.5"></circle>
                <path d="m12.5 12.5 4 4"></path>
              </svg>
              <input
                class="transcript-search-input"
                id="transcriptSearchInput"
                type="search"
                placeholder="搜索单词或短语"
                aria-label="搜索字幕"
                aria-controls="transcriptList"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                class="transcript-search-clear"
                id="transcriptSearchClearBtn"
                type="button"
                aria-label="清除字幕搜索"
                title="清除搜索"
                hidden
              >
                &times;
              </button>
              <output
                class="transcript-search-count"
                id="transcriptSearchCount"
                aria-live="polite"
              ></output>
              <div
                class="transcript-search-nav"
                role="group"
                aria-label="搜索结果"
              >
                <button
                  id="transcriptSearchPrevBtn"
                  type="button"
                  aria-label="上一处字幕匹配"
                  title="上一处匹配（Shift + Enter）"
                  disabled
                >
                  &#8593;
                </button>
                <button
                  id="transcriptSearchNextBtn"
                  type="button"
                  aria-label="下一处字幕匹配"
                  title="下一处匹配（Enter）"
                  disabled
                >
                  &#8595;
                </button>
              </div>
            </div>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div class="tab-panel" data-panel="overview">
          <!-- Chapters -->
          <div class="section">
            <div class="section-title">章节</div>
            <ul class="chapter-list" id="chapterList">
              <li
                class="chapter-item"
                style="
                  color: var(--text-muted);
                  cursor: default;
                  border-color: var(--border);
                "
              >
                章节将显示在这里
              </li>
            </ul>
          </div>

          <!-- Key Quotes -->
          <div class="section">
            <div class="section-title">关键引述</div>
            <div id="quotesList">
              <div
                class="quote-item"
                style="
                  color: var(--text-muted);
                  border-left-color: var(--border);
                  cursor: default;
                "
              >
                <div class="quote-text" style="font-style: normal">
                  查看此标签页时将提取关键引述…
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div class="tab-panel" data-panel="notes">
          <div class="section">
            <div class="section-header">
              <div class="section-title">已保存的笔记</div>
              <div class="notes-filter">
                <button
                  class="enhance-btn active"
                  id="notesFilterThis"
                  aria-pressed="true"
                >
                  本视频
                </button>
                <button
                  class="enhance-btn"
                  id="notesFilterAll"
                  aria-pressed="false"
                >
                  全部笔记
                </button>
              </div>
            </div>
            <p class="notes-intro" id="notesIntro">
              将鼠标移到视频上并点击“笔记”即可保存带时间戳的笔记，也可在视频聚焦时按 n 键。
            </p>
            <div id="notesList"></div>
          </div>
        </div>

        <!-- TAB: Chat (manual Q&A over the current video's transcript) -->
        <div class="tab-panel" data-panel="chat">
          <div class="section">
            <div class="section-header">
              <div class="section-title">视频对话</div>
              <div class="chat-header-actions">
                <button
                  class="enhance-btn"
                  id="chatHistoryBtn"
                  type="button"
                  aria-expanded="false"
                  aria-controls="chatHistoryPanel"
                >
                  历史
                </button>
                <button
                  class="enhance-btn"
                  id="chatExportBtn"
                  type="button"
                  disabled
                >
                  导出
                </button>
              </div>
            </div>
            <div class="chat-reference" id="chatReferenceCard">
              <div class="chat-reference-text" id="chatReference"></div>
              <div class="chat-reference-actions">
                <a
                  class="chat-reference-link"
                  id="chatReferenceLink"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                  hidden
                >
                  打开视频
                </a>
                <span
                  class="chat-reference-meta"
                  id="chatReferenceMeta"
                  hidden
                ></span>
              </div>
            </div>
            <div class="chat-history-panel" id="chatHistoryPanel" hidden>
              <div class="chat-history-title">历史对话</div>
              <div class="chat-history-empty" id="chatHistoryEmpty">
                还没有保存的对话
              </div>
              <div class="chat-history-list" id="chatHistoryList"></div>
            </div>
            <div class="chat-messages chat-messages-empty" id="chatMessages">
              <!-- Thinking bubble: reused by sidepanel.js while an answer is in flight. -->
              <div
                class="chat-message chat-message-assistant chat-thinking"
                id="chatThinking"
                role="status"
                hidden
              >
                <div class="chat-message-label">AI</div>
                <div class="chat-message-text chat-thinking-body">
                  <span class="chat-thinking-dots" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                  </span>
                  <span class="chat-thinking-text" id="chatThinkingText">
                    正在深度思考…
                  </span>
                </div>
              </div>
            </div>
            <div class="chat-empty" id="chatEmpty">
              还没有对话。在下面输入问题，点发送后 AI 才会回答。
              <div class="chat-suggestions" id="chatSuggestions">
                <button
                  class="chat-suggestion"
                  type="button"
                  data-prompt="深度解读这个视频"
                >
                  深度解读这个视频
                </button>
                <button
                  class="chat-suggestion"
                  type="button"
                  data-prompt="核心观点是什么"
                >
                  核心观点是什么
                </button>
                <button
                  class="chat-suggestion"
                  type="button"
                  data-prompt="按时间线梳理"
                >
                  按时间线梳理
                </button>
              </div>
            </div>
            <div
              class="chat-context-note"
              id="chatContextNote"
              role="status"
              hidden
            ></div>
            <div class="chat-composer">
              <textarea
                class="chat-input"
                id="chatInput"
                rows="3"
                placeholder="问问这个视频，例如：用它自己的话总结重点"
              ></textarea>
              <div class="chat-composer-footer">
                <span class="chat-hint">Enter 发送，Shift + Enter 换行</span>
                <button
                  class="enhance-btn chat-send-btn"
                  id="chatSendBtn"
                  type="button"
                >
                  发送
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      style="display: none"
    >
      跟随播放
    </button>

    <script src="settings.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
